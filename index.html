<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Abrindo o WhatsApp…</title>
<style>
  :root { --bg:#ffffff; --fg:#1f2a24; --muted:#5b6b62; --btn:#1fa855; }
  @media (prefers-color-scheme: dark) { :root { --bg:#101613; --fg:#e8efe9; --muted:#9db0a4; } }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--fg);
         font:17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:24px; text-align:center; }
  p { margin:0 0 20px; color:var(--muted); }
  h1 { font-size:22px; margin:0 0 8px; }
  a.btn { display:inline-block; background:var(--btn); color:#fff; text-decoration:none; font-weight:600;
          padding:14px 26px; border-radius:999px; }
  a.btn:focus-visible { outline:3px solid var(--fg); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <h1>Abrindo o WhatsApp…</h1>
  <p>Se não abrir sozinho, toque no botão.</p>
  <a class="btn" id="go" href="#">Abrir conversa no WhatsApp</a>
</main>

<script>
(function () {
  // ===== CONFIGURAÇÃO =====
  var WEBHOOK  = "https://webhook.unnica.com.br/functions/v1/flow-webhook-receive?token=whk_Mx2BxtzgayAbPEoUCpNjaBbZR6uIG0JH";
  var TELEFONE = "5519999817138";
  var MENSAGEM = "Olá, vim do última volta!";
  var ORIGEM   = "QR Code - Última Volta";
  var PREFIXO  = "UV";          // prefixo do código de rastreio
  var ESPERA_MAX_MS = 1200;     // tempo máximo esperando o webhook antes de redirecionar
  // ========================

  var params = new URLSearchParams(location.search);
  var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var codigo = PREFIXO + "-";
  for (var i = 0; i < 5; i++) codigo += chars[Math.floor(Math.random() * chars.length)];

  var textoFinal = MENSAGEM + " (#" + codigo + ")";
  var waUrl = "https://wa.me/" + TELEFONE + "?text=" + encodeURIComponent(textoFinal);
  document.getElementById("go").href = waUrl;

  var payload = {
    evento: "qr_scan",
    codigo: codigo,
    origem: ORIGEM,
    mensagem: textoFinal,
    telefone_destino: TELEFONE,
    data_hora: new Date().toISOString(),
    utm_source:   params.get("utm_source")   || "qrcode",
    utm_medium:   params.get("utm_medium")   || "offline",
    utm_campaign: params.get("utm_campaign") || "ultima-volta",
    utm_content:  params.get("utm_content")  || "",
    dispositivo: navigator.userAgent,
    idioma: navigator.language,
    referrer: document.referrer || ""
  };

  var redirecionado = false;
  function redirecionar() {
    if (redirecionado) return;
    redirecionado = true;
    location.replace(waUrl);
  }

  var body = JSON.stringify(payload);

  function envioSimples() {
    // Requisição "simples" (sem preflight de CORS): sempre chega ao servidor
    return fetch(WEBHOOK, { method: "POST", mode: "no-cors", keepalive: true,
                            headers: { "Content-Type": "text/plain;charset=UTF-8" }, body: body });
  }

  fetch(WEBHOOK, { method: "POST", keepalive: true,
                   headers: { "Content-Type": "application/json" }, body: body })
    .catch(envioSimples)
    .finally(redirecionar);

  setTimeout(redirecionar, ESPERA_MAX_MS);
})();
</script>
</body>
</html>
